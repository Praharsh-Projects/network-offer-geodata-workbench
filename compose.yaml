services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netgeo
      POSTGRES_PASSWORD: netgeo
      POSTGRES_USER: netgeo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netgeo -d netgeo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NETGEO_DATABASE_URL: postgresql://netgeo:netgeo@postgres:5432/netgeo
      NETGEO_GEOMETRY_ENGINE: qgis
      NETGEO_WFS_BASE_URL: http://backend:8000/fixtures/wfs
      NETGEO_WMS_BASE_URL: http://backend:8000/fixtures/wms
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
