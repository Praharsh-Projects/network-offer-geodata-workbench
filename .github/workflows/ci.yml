name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Format and lint
        run: |
          ruff format --check backend
          ruff check backend
      - name: Static types
        working-directory: backend
        run: mypy src tests
      - name: Core tests and branch coverage
        working-directory: backend
        run: pytest -m "not qgis and not postgres" --cov=network_offer --cov-branch --cov-report=term-missing --cov-fail-under=90
      - name: Python dependency audit
        run: |
          python -m pip freeze --exclude-editable > /tmp/netgeo-audit-requirements.txt
          pip-audit --strict --requirement /tmp/netgeo-audit-requirements.txt --progress-spinner off

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netgeo
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netgeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      - name: Exercise JSONB audit repository
        working-directory: backend
        env:
          NETGEO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/netgeo
        run: pytest -m postgres

  pyqgis:
    name: PyQGIS container contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build QGIS runtime and test target
        run: docker build --target test --tag network-offer-backend:test --file backend/Dockerfile .
      - name: Execute PyQGIS geometry contract
        run: docker run --rm --env QT_QPA_PLATFORM=offscreen --env QGIS_PREFIX_PATH=/usr network-offer-backend:test

  frontend:
    name: Nuxt client and Node runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and unit coverage
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm test:coverage
      - name: Browser workflow
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Production build
        working-directory: frontend
        run: pnpm build
      - name: Node dependency audit
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Build frontend container
        run: docker build --tag network-offer-frontend:test --file frontend/Dockerfile .
